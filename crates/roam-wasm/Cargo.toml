[package]
name = "roam-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true

# cdylib for the browser artifact, rlib so the native test target can link the
# same code and generate the interop fixture.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
roam-crdt = { path = "../roam-crdt" }
roam-storage = { path = "../roam-storage" }
roam-backend-client = { path = "../roam-backend-client" }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
# The worker's command protocol (`session`) is plain Rust so it can be tested
# natively, which means its JSON handling has to be a plain dependency too — not
# the wasm-only one the test-relay used to carry.
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }

[features]
# Exports a MemoryBackend-backed relay so the node harness can serve real HTTP.
# Off by default: the shipped browser artifact must not contain a test double.
test-relay = []

# Exports the OPFS storage checks for the headless-browser harness. These need
# `roam-storage/conformance`, which lifts the one suite every `VaultFs` must pass
# out of `cfg(test)`. Off by default, like `test-relay`, so neither the test
# suite nor a test double can reach a shipped artifact.
browser-test = ["roam-storage/conformance"]

# wasm-bindgen is target-gated ON PURPOSE. Nothing in a native build — least of
# all the CLI — may transitively pull wasm-bindgen in; gating it here makes that
# structurally impossible rather than a convention we have to remember. It also
# keeps `cargo test` on the host free of JsValue/JsError, so the core `Doc` type
# stays plain Rust with plain `CrdtError`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
