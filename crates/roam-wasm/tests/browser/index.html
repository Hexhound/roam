<!doctype html>
<!--
  The page runs two suites in sequence and reports both:

    1. the OPFS storage checks, in a worker of their own — they assert the
       browser's own behaviour, so they have to be where the sync access handles
       are;
    2. the session checks, which drive the SHIPPED worker
       (`worker/roam-worker.js`) from the page, the way a real app does.

  Nothing storage-related happens on the page itself, on purpose: OPFS sync
  access handles do not exist on the main thread.
-->
<html>
<body><pre id="out">running</pre>
<script type="module">
import { runSessionChecks } from './session-checks.mjs';

const report = async (failed, results) => {
  document.getElementById('out').textContent = results.join('\n');
  await fetch('/report', {
    method: 'POST',
    body: JSON.stringify({ failed, results }),
  });
};

// A Rust panic aborts the worker, so its own error handling never runs. The
// worker forwards each panic message the instant it is produced; hold them here
// so a crash can still say what actually failed.
const panics = [];

const storageChecks = new Promise((resolve) => {
  const worker = new Worker('worker.js', { type: 'module' });
  worker.onmessage = (e) => {
    if (e.data.panic !== undefined) {
      panics.push(e.data.panic);
      return;
    }
    resolve(e.data);
  };
  worker.onerror = (e) =>
    resolve({
      failed: 1,
      results: [
        'storage worker crashed: ' + e.message,
        ...panics.map((p) => '      ' + p),
      ],
    });
});

// A suite that never answers must not leave the runner hanging until the
// server's own timeout; say so instead, while there is still a page to say it.
const deadline = setTimeout(
  () => report(1, ['the checks did not report within 120s']),
  120000
);

(async () => {
  const storage = await storageChecks;
  let session;
  try {
    session = await runSessionChecks();
  } catch (e) {
    session = { failed: 1, results: ['session checks threw: ' + e] };
  }
  clearTimeout(deadline);
  await report(storage.failed + session.failed, [
    ...storage.results,
    '',
    ...session.results,
  ]);
})();
</script>
</body>
</html>
