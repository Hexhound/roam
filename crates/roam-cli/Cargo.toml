[package]
name = "roam-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "roam"
path = "src/main.rs"

[dependencies]
roam-storage = { path = "../roam-storage" }
roam-crdt = { path = "../roam-crdt" }
roam-sync-core = { path = "../roam-sync-core" }
roam-transport-iroh = { path = "../roam-transport-iroh" }
roam-files = { path = "../roam-files" }
roam-backend-client = { path = "../roam-backend-client" }
iroh.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "signal"] }
clap.workspace = true
anyhow.workspace = true
notify.workspace = true
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true
