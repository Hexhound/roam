[package]
name = "roam-pake"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# No roam dependencies: this is a self-contained handshake over byte strings and
# 32-byte endpoint ids, so it can be unit-tested with no network and reused by
# both LAN vault pairing and LocalSend share.
[dependencies]
spake2 = { workspace = true }
blake3.workspace = true
chacha20poly1305.workspace = true
rand.workspace = true
thiserror.workspace = true
zeroize = { workspace = true }
