[workspace]
resolver = "2"
members = ["crates/roam-crdt", "crates/roam-storage", "crates/roam-sync-core", "crates/roam-transport-iroh", "crates/roam-cli", "crates/roam-files", "crates/roam-backend-client", "crates/roam-rbsr", "crates/roam-wasm", "crates/roam-share", "crates/roam-pake", "crates/roam-share-iroh"]

[workspace.package]
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/roam/roam-sync"

[workspace.dependencies]
loro = "1.13.9"
negentropy = "0.5"
ed25519-dalek = { version = "2", features = ["hazmat"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"
proptest = "1"
tempfile = "3"
# NO `rt-multi-thread` here: tokio hard-errors at compile time on wasm32
# ("Only features sync,macros,io-util,rt,time are supported on wasm"), and a
# workspace default leaks into every crate. The browser client's dependency
# graph must stay wasm-clean, so crates that genuinely need a multi-threaded
# runtime (roam-cli, and dev-deps for #[tokio::test]) opt in themselves.
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
async-trait = "0.1"
futures = "0.3"
postcard = { version = "1", default-features = false, features = ["use-std"] }
anyhow = "1"
iroh = { version = "1.0.0", features = ["platform-verifier"] }
# LAN discovery: iroh's presets::N0 has NO mDNS (pkarr/DNS/relay only), so
# finding a device on the same Wi-Fi without internet needs this separately.
iroh-mdns-address-lookup = "0.4"
clap = { version = "4", features = ["derive"] }
notify = "6"
blake3 = "1"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
chacha20poly1305 = "0.10"
# SPAKE2 for the LAN short-code pairing flow (a 6-digit code is ~20 bits, so it
# is only safe inside a PAKE). RustCrypto/PAKEs; NOT independently audited —
# see the roam-pake crate docs.
spake2 = "0.4"
# Terminal QR for the internet pairing flow. default-features off: the default
# `image` feature drags in the whole image crate for a picture we never render.
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# WASM web client (F3). These are EXACT pins, not preferences: wasm-bindgen's
# generated glue is schema-versioned, so the crate version must equal the
# wasm-bindgen-cli version provided by the devenv (see .nix/devenv.nix). nixpkgs
# has no 0.2.127, hence 0.2.126 rather than latest. js-sys/web-sys pin
# wasm-bindgen exactly in turn, so 0.2.126 forces js-sys 0.3.103. Bump all of
# these together with the devenv package, never independently.
wasm-bindgen = "=0.2.126"
wasm-bindgen-test = "=0.3.76"
js-sys = "=0.3.103"
# Pulled in by the generated glue for every `async fn` binding. Pinned with the
# rest: it depends on wasm-bindgen exactly.
wasm-bindgen-futures = "=0.4.76"

# Debug info for OUR code, none for our dependencies.
#
# Without this, `target/` reached 40 GB. Cargo defaults `debug = true` for dev
# and test, and roam links iroh + quinn + loro statically into every one of
# ~135 test binaries — each one 370-430 MB, almost all of it DWARF belonging to
# dependencies nobody sets a breakpoint in. `package."*"` matches every
# non-workspace dependency and explicitly NOT workspace members, so roam's own
# crates keep full debug info: locals, types, expression evaluation, all of it.
#
# Measured on roam-backend-client's test binary rather than assumed:
#
#     156 MB   cargo default, debug info everywhere
#      53 MB   this config
#      33 MB   debug info switched off entirely
#
# So it recovers two thirds of the size for 20 MB more than the nuclear option,
# and the iroh-linked binaries should do better still — their dependency share
# is larger.
#
# The one thing this costs is stepping *inside* a dependency. When that is
# genuinely what you need, override for the run rather than changing this:
#
#     CARGO_PROFILE_TEST_DEBUG=2 cargo test -p roam-storage
#
# Release and bench profiles are deliberately untouched.
[profile.dev]
debug = true

[profile.dev.package."*"]
debug = false

[profile.test]
debug = true

[profile.test.package."*"]
debug = false
